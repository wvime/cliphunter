[project]
name = "cliphunter"
version = "0.1.0"
description = "Watch up to two live streams, keep a rolling buffer, and cut clips locally."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "psutil>=5.9,<8",
    "python-dotenv>=1.0,<2",
    "pynput>=1.7.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
cliphunter = "cliphunter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cliphunter*"]

[tool.setuptools.package-data]
"cliphunter.storage" = ["schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
